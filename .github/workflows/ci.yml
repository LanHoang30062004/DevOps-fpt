name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  IMAGE_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}
  IMAGE_TAG: ${{ github.sha }}
  SHOULD_PUSH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}

jobs:
  lint:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Check backend application
        working-directory: backend
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
        run: python -c "from app.main import app; assert app.title == 'User Management Service'; print('Application import successful')"

      - name: Run backend tests when available
        if: ${{ hashFiles('backend/tests/**/*.py') != '' }}
        working-directory: backend
        run: python -m pip install pytest pytest-cov && python -m pytest --cov=app --cov-report=xml:coverage.xml -q

      - name: Upload backend coverage report
        if: ${{ hashFiles('backend/coverage.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Check formatting
        working-directory: frontend
        run: npm run format:check

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload frontend test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-report
          path: frontend/test-results/vitest-junit.xml
          if-no-files-found: error

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: error

  build:
    name: Build application
    runs-on: ubuntu-latest
    needs: sonarqube

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error

  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download frontend coverage report
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Download backend coverage report when available
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend
          if-no-artifact-found: ignore

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: build

    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ env.SHOULD_PUSH == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ env.SHOULD_PUSH == 'true' }}
          tags: ${{ env.IMAGE_NAMESPACE }}/user-management-${{ matrix.name }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy staging with Docker Compose
    if: ${{ needs.sonarqube.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    needs: [docker, sonarqube]
    runs-on: ubuntu-latest
    environment:
      name: staging
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE_TAG: ${{ github.sha }}
      PREVIOUS_IMAGE_TAG: ${{ github.event.before || 'latest' }}
      COMPOSE_PROJECT_NAME: user-management-staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start staging canary
        env:
          BACKEND_PORT: 18000
          FRONTEND_PORT: 13000
        run: docker compose -p "$COMPOSE_PROJECT_NAME" up -d --pull always --wait

      - name: Smoke test staging canary
        run: |
          set -Eeuo pipefail
          if ! curl --fail --retry 12 --retry-delay 5 http://localhost:18000/health || \
            ! curl --fail --retry 12 --retry-delay 5 http://localhost:13000/; then
            docker compose -p "$COMPOSE_PROJECT_NAME" down
            exit 1
          fi

      - name: Promote staging canary with rollback
        run: |
          set -Eeuo pipefail
          docker compose -p "$COMPOSE_PROJECT_NAME" down
          export BACKEND_PORT=8000
          export FRONTEND_PORT=3000

          if ! docker compose -p "$COMPOSE_PROJECT_NAME" up -d --pull always --wait || \
            ! curl --fail --retry 12 --retry-delay 5 http://localhost:8000/health || \
            ! curl --fail --retry 12 --retry-delay 5 http://localhost:3000/; then
            echo "Staging promotion failed; rolling back to $PREVIOUS_IMAGE_TAG"
            export IMAGE_TAG="$PREVIOUS_IMAGE_TAG"
            docker compose -p "$COMPOSE_PROJECT_NAME" up -d --pull always --wait || true
            exit 1
          fi

      - name: Show staging services
        run: docker compose -p "$COMPOSE_PROJECT_NAME" ps

  deploy-production:
    name: Deploy production with Docker Compose
    if: ${{ needs.sonarqube.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [docker, sonarqube]
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE_TAG: ${{ github.sha }}
      PREVIOUS_IMAGE_TAG: ${{ github.event.before || 'latest' }}
      COMPOSE_PROJECT_NAME: user-management-production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start production canary
        env:
          BACKEND_PORT: 18000
          FRONTEND_PORT: 13000
        run: docker compose -p "$COMPOSE_PROJECT_NAME" up -d --pull always --wait

      - name: Smoke test production canary
        run: |
          set -Eeuo pipefail
          if ! curl --fail --retry 12 --retry-delay 5 http://localhost:18000/health || \
            ! curl --fail --retry 12 --retry-delay 5 http://localhost:13000/; then
            docker compose -p "$COMPOSE_PROJECT_NAME" down
            exit 1
          fi

      - name: Promote production canary with rollback
        run: |
          set -Eeuo pipefail
          docker compose -p "$COMPOSE_PROJECT_NAME" down
          export BACKEND_PORT=8000
          export FRONTEND_PORT=3000

          if ! docker compose -p "$COMPOSE_PROJECT_NAME" up -d --pull always --wait || \
            ! curl --fail --retry 12 --retry-delay 5 http://localhost:8000/health || \
            ! curl --fail --retry 12 --retry-delay 5 http://localhost:3000/; then
            echo "Production promotion failed; rolling back to $PREVIOUS_IMAGE_TAG"
            export IMAGE_TAG="$PREVIOUS_IMAGE_TAG"
            docker compose -p "$COMPOSE_PROJECT_NAME" up -d --pull always --wait || true
            exit 1
          fi

      - name: Show production services
        run: docker compose -p "$COMPOSE_PROJECT_NAME" ps
